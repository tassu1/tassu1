<svg width="640" height="290" viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Terminal animation: whoami returns Md Tahseen Alam, role returns Backend-Focused Full Stack Developer, focus returns Backend Architecture and API Design, Security, Cloud, building returns Reliable systems, useful products." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1F2933" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="638" height="288" rx="12" fill="url(#bgGrad)" stroke="#21262D" stroke-width="1.5"/>
  <rect x="1" y="1" width="638" height="288" rx="12" fill="url(#grid)"/>

  <!-- title bar -->
  <rect x="1" y="1" width="638" height="34" rx="12" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
  <rect x="1" y="23" width="638" height="12" fill="#161B22"/>
  <circle cx="24" cy="18" r="5.5" fill="#FF5F57"/>
  <circle cx="42" cy="18" r="5.5" fill="#FEBC2E"/>
  <circle cx="60" cy="18" r="5.5" fill="#28C840"/>
  <text x="320" y="22" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="11" fill="#8B949E" letter-spacing="0.5">tahseen@dev — zsh</text>

  <!-- body -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17">

    <!-- $ whoami -->
    <text x="26" y="76" fill="#10B981">$<tspan fill="#E6EDF3" dx="10">whoami</tspan>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.042;0.05;0.917;0.983;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="26" y="104" fill="#E6EDF3">Md Tahseen Alam
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.125;0.133;0.917;0.983;1" values="0;0;1;1;0;0"/>
    </text>

    <!-- $ role -->
    <text x="26" y="138" fill="#10B981">$<tspan fill="#E6EDF3" dx="10">role</tspan>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.208;0.216;0.917;0.983;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="26" y="166" fill="#E6EDF3">Backend-Focused Full Stack Developer
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.292;0.3;0.917;0.983;1" values="0;0;1;1;0;0"/>
    </text>

    <!-- $ focus -->
    <text x="26" y="200" fill="#10B981">$<tspan fill="#E6EDF3" dx="10">focus</tspan>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.375;0.383;0.917;0.983;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="26" y="228" fill="#E6EDF3">Backend Architecture
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.458;0.466;0.917;0.983;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="26" y="250" fill="#8B949E" font-size="15">API Design · Security · Cloud
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.5;0.508;0.917;0.983;1" values="0;0;1;1;0;0"/>
    </text>

    <!-- $ building -->
    <text x="360" y="76" fill="#10B981">$<tspan fill="#E6EDF3" dx="10">building</tspan>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.583;0.591;0.917;0.983;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="360" y="104" fill="#E6EDF3" font-size="15">Reliable systems.
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.667;0.675;0.917;0.983;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="360" y="124" fill="#E6EDF3" font-size="15">Useful products.
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.667;0.675;0.917;0.983;1" values="0;0;1;1;0;0"/>
    </text>

    <!-- blinking cursor, tracks near the last active line loosely by staying bottom-left -->
    <rect x="26" y="260" width="10" height="16" fill="#10B981">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
