<svg width="700" height="140" viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Lexica AI workflow: a single prompt goes through a prompt-enhancement pass, then a generation pass, then exports as PDF or DOCX." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow-g3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#10B981"/>
    </marker>
  </defs>
  <rect width="700" height="140" fill="#0D1117"/>
  <g font-family="ui-monospace, Menlo, monospace" fill="#E6EDF3">
    <!-- 4 stages -->
    <g>
      <rect x="10" y="40" width="140" height="56" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
      <text x="80" y="64" text-anchor="middle" font-size="11" font-weight="600">Prompt</text>
      <text x="80" y="80" text-anchor="middle" font-size="8.5" fill="#8B949E">User input</text>
    </g>
    <line x1="150" y1="68" x2="188" y2="68" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-g3)"/>

    <g>
      <rect x="192" y="40" width="150" height="56" rx="8" fill="#0B2E23" stroke="#10B981" stroke-width="1.3" stroke-opacity="0.6"/>
      <text x="267" y="64" text-anchor="middle" font-size="11" font-weight="600">Enhancement</text>
      <text x="267" y="80" text-anchor="middle" font-size="8.5" fill="#8B949E">Refines the prompt</text>
    </g>
    <line x1="342" y1="68" x2="380" y2="68" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-g3)"/>

    <g>
      <rect x="384" y="40" width="150" height="56" rx="8" fill="#0B2E23" stroke="#10B981" stroke-width="1.3" stroke-opacity="0.6"/>
      <text x="459" y="64" text-anchor="middle" font-size="11" font-weight="600">Generation</text>
      <text x="459" y="80" text-anchor="middle" font-size="8.5" fill="#8B949E">Structured document</text>
    </g>
    <line x1="534" y1="68" x2="572" y2="68" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-g3)"/>

    <g>
      <rect x="576" y="40" width="114" height="56" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
      <text x="633" y="64" text-anchor="middle" font-size="11" font-weight="600">Export</text>
      <text x="633" y="80" text-anchor="middle" font-size="8.5" fill="#8B949E">PDF / DOCX</text>
    </g>
  </g>
</svg>
