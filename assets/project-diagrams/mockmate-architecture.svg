<svg width="760" height="360" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="MockMate architecture: interview interface talks to the API over SSE for the live interview, while report generation is queued through Redis and BullMQ to a background worker with retry and backoff, which produces the interview report." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow-g2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#10B981"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#0D1117"/>
  <g font-family="ui-monospace, Menlo, monospace" fill="#E6EDF3">

    <!-- Client -->
    <rect x="20" y="140" width="150" height="70" rx="10" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
    <text x="95" y="170" text-anchor="middle" font-size="12" font-weight="600">Interview UI</text>
    <text x="95" y="186" text-anchor="middle" font-size="9" fill="#8B949E">Live session</text>

    <!-- API -->
    <rect x="230" y="140" width="150" height="70" rx="10" fill="#0B2E23" stroke="#10B981" stroke-width="1.3" stroke-opacity="0.6"/>
    <text x="305" y="168" text-anchor="middle" font-size="12" font-weight="600">API (Express)</text>
    <text x="305" y="184" text-anchor="middle" font-size="9" fill="#8B949E">AI interview + SSE</text>

    <line x1="170" y1="175" x2="228" y2="175" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-g2)"/>
    <line x1="228" y1="190" x2="170" y2="190" stroke="#21262D" stroke-width="1.3" marker-end="url(#arrow-g2)"/>
    <text x="199" y="165" text-anchor="middle" font-size="8" fill="#8B949E">request</text>
    <text x="199" y="203" text-anchor="middle" font-size="8" fill="#8B949E">SSE stream</text>

    <!-- down to queue -->
    <path id="toQueue" d="M 305 210 L 305 260" fill="none" stroke="#21262D" stroke-width="1.5" marker-end="url(#arrow-g2)"/>
    <text x="330" y="238" font-size="8" fill="#8B949E">enqueue job</text>

    <!-- Redis / BullMQ -->
    <g transform="translate(230,264)">
      <rect x="8" y="8" width="150" height="60" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1" opacity="0.5"/>
      <rect x="4" y="4" width="150" height="60" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1" opacity="0.75"/>
      <rect x="0" y="0" width="150" height="60" rx="8" fill="#161B22" stroke="#10B981" stroke-width="1.3" stroke-opacity="0.6"/>
      <text x="75" y="27" text-anchor="middle" font-size="12" font-weight="600">Redis</text>
      <text x="75" y="44" text-anchor="middle" font-size="9" fill="#8B949E">BullMQ queue</text>
    </g>

    <path id="toWorker" d="M 380 294 L 460 294" fill="none" stroke="#21262D" stroke-width="1.5" marker-end="url(#arrow-g2)"/>

    <!-- Worker -->
    <rect x="470" y="264" width="150" height="60" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
    <text x="545" y="288" text-anchor="middle" font-size="12" font-weight="600">Worker</text>
    <text x="545" y="304" text-anchor="middle" font-size="8.5" fill="#8B949E">up to 3 attempts</text>
    <text x="545" y="316" text-anchor="middle" font-size="8.5" fill="#8B949E">exponential backoff</text>

    <path id="toReport" d="M 545 264 L 545 210 L 620 210" fill="none" stroke="#21262D" stroke-width="1.5" marker-end="url(#arrow-g2)"/>

    <!-- Report -->
    <rect x="620" y="180" width="120" height="60" rx="8" fill="#0B2E23" stroke="#10B981" stroke-width="1.3" stroke-opacity="0.6"/>
    <text x="680" y="204" text-anchor="middle" font-size="11" font-weight="600">Interview</text>
    <text x="680" y="219" text-anchor="middle" font-size="11" font-weight="600">Report</text>

    <path d="M 620 200 C 500 200, 460 175, 380 175" fill="none" stroke="#21262D" stroke-width="1.3" marker-end="url(#arrow-g2)" opacity="0.7"/>
    <text x="500" y="160" text-anchor="middle" font-size="8" fill="#8B949E">progress / completion via SSE</text>

    <!-- animated flow dot along enqueue -> worker -> report path -->
    <circle r="3.2" fill="#10B981">
      <animateMotion dur="4s" repeatCount="indefinite">
        <mpath href="#toQueue"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.2" fill="#10B981">
      <animateMotion dur="4s" begin="1s" repeatCount="indefinite">
        <mpath href="#toWorker"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.2" fill="#10B981">
      <animateMotion dur="4s" begin="2s" repeatCount="indefinite">
        <mpath href="#toReport"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
