<svg width="700" height="440" viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="EduManage architecture: web application with five roles connects to an Express API enforcing JWT, RBAC, and school-context validation, which reads and writes school-scoped data in MongoDB, with Socket.IO providing real-time communication back to the client." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow-g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#10B981"/>
    </marker>
  </defs>
  <rect width="700" height="440" fill="#0D1117"/>
  <g font-family="ui-monospace, Menlo, monospace" fill="#E6EDF3">

    <!-- Client -->
    <rect x="220" y="16" width="260" height="64" rx="10" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
    <rect x="220" y="16" width="260" height="16" rx="10" fill="#1F2933"/>
    <circle cx="234" cy="24" r="2.5" fill="#FF5F57"/><circle cx="244" cy="24" r="2.5" fill="#FEBC2E"/><circle cx="254" cy="24" r="2.5" fill="#28C840"/>
    <text x="350" y="58" text-anchor="middle" font-size="13" font-weight="600">Web Application</text>
    <text x="350" y="74" text-anchor="middle" font-size="9.5" fill="#8B949E">Super Admin · School Admin · Teacher · Student · Parent</text>

    <line x1="350" y1="80" x2="350" y2="118" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-g)"/>

    <!-- API -->
    <rect x="190" y="122" width="320" height="80" rx="10" fill="#0B2E23" stroke="#10B981" stroke-width="1.3" stroke-opacity="0.6"/>
    <text x="350" y="150" text-anchor="middle" font-size="13" font-weight="600">Express API</text>
    <text x="350" y="170" text-anchor="middle" font-size="10" fill="#8B949E">JWT Auth · Role Authorization (RBAC)</text>
    <text x="350" y="186" text-anchor="middle" font-size="10" fill="#8B949E">School-Context Validation Middleware</text>

    <line x1="350" y1="202" x2="350" y2="252" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-g)"/>
    <!-- gate icon -->
    <polygon points="350,214 366,228 350,242 334,228" fill="#161B22" stroke="#10B981" stroke-width="1.3"/>
    <text x="350" y="232" text-anchor="middle" font-size="8" fill="#10B981">schoolId</text>

    <!-- MongoDB -->
    <g transform="translate(230,256)">
      <path d="M0,10 A120,10 0 0 1 240,10 L240,70 A120,10 0 0 1 0,70 Z" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
      <ellipse cx="120" cy="10" rx="120" ry="10" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
      <text x="120" y="44" text-anchor="middle" font-size="13" font-weight="600">MongoDB</text>
      <text x="120" y="60" text-anchor="middle" font-size="9.5" fill="#8B949E">School-scoped queries</text>
    </g>

    <!-- Socket.IO branch -->
    <path d="M 510 162 C 600 162, 600 60, 484 50" fill="none" stroke="#21262D" stroke-width="1.5" marker-end="url(#arrow-g)"/>
    <rect x="520" y="130" width="150" height="58" rx="10" fill="#161B22" stroke="#21262D" stroke-width="1.5"/>
    <text x="595" y="154" text-anchor="middle" font-size="12" font-weight="600">Socket.IO</text>
    <text x="595" y="170" text-anchor="middle" font-size="9" fill="#8B949E">Real-time comms</text>
    <line x1="520" y1="159" x2="510" y2="159" stroke="#21262D" stroke-width="1.5"/>
    <path d="M 510 159 C 480 159, 480 200, 510 202" fill="none" stroke="#21262D" stroke-width="1.5"/>

    <!-- legend -->
    <text x="24" y="400" font-size="10" fill="#8B949E">5 roles · tested across 4 schools · 35+ demo accounts</text>
    <text x="24" y="420" font-size="10" fill="#8B949E">Isolation is enforced per request, not by separate databases per school.</text>
  </g>
</svg>
