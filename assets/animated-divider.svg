<svg width="900" height="6" viewBox="0 0 900 6" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decorative animated divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="2" width="900" height="1.5" fill="#21262D"/>
  <rect x="-120" y="0" width="120" height="6" rx="3" fill="#10B981" opacity="0.85">
    <animate attributeName="x" from="-120" to="900" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
