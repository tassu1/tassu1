<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-label="Welcome to Tahseen's Github" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.35" stop-color="#2b2b2b"/>
      <stop offset="0.62" stop-color="#d6d6d6"/>
      <stop offset="0.66" stop-color="#9a9a9a"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/><stop offset="1" stop-color="#6e6e6e"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="310" fill="url(#sky)"/>
  <!-- distant hills -->
  <path d="M0 200 C80 180 140 185 220 192 C300 168 360 176 430 190 C500 172 560 178 640 188 C720 170 800 176 880 190 C930 182 970 186 1000 192 V310 H0Z" fill="url(#far)"/>
  <!-- mid dunes -->
  <path d="M0 225 C120 195 240 205 360 222 C470 236 520 200 640 205 C760 210 860 190 1000 215 V310 H0Z" fill="url(#mid)"/>
  <path d="M0 215 C120 187 240 197 360 214" fill="none" stroke="#5a5a5a" stroke-width="1.2" opacity=".7"/>
  <!-- river -->
  <path d="M492 196 C470 205 540 212 520 228 C495 246 410 250 432 274 C442 288 392 296 372 310 L560 310 C596 292 640 276 608 256 C578 238 640 222 560 210 C534 205 514 202 508 196 Z" fill="url(#river)" opacity=".92"/>
  <!-- foreground dunes -->
  <path d="M0 262 C90 246 170 250 250 268 C300 280 340 290 372 310 H0Z" fill="#000"/>
  <path d="M1000 255 C900 245 800 258 720 276 C670 288 640 298 608 310 H1000Z" fill="#000"/>
  <!-- title -->
  <text x="500" y="92" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="34" fill="#ffffff" letter-spacing="1.5">Welcome to Tahseen's Github</text>
  <text x="500" y="132" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="30" fill="#ffffff">&lt;/&gt;
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </text>
</svg>
