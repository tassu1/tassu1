name: Update recent activity

# Keeps the <!--START_SECTION:activity--> ... <!--END_SECTION:activity-->
# block in README.md filled with your real recent public GitHub activity.
#
# Uses jamesgeorge007/github-activity-readme, a widely used, actively
# maintained community action. Verify the action's current README/version
# before relying on it long-term — third-party actions do change.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — adjust if you want it less/more frequent
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update recent activity section
        uses: jamesgeorge007/github-activity-readme@v2.4.4
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MAX_LINES: 5
          COMMIT_MSG: 'docs: update recent activity'

# Setup notes:
# 1. This action needs a Personal Access Token (classic, `repo` scope) saved
#    as a repository secret named GH_TOKEN — the default GITHUB_TOKEN does
#    not have enough permission for this particular action to push commits
#    back cleanly in all cases. Check the action's README for the current
#    requirement before assuming this.
# 2. Never print GH_TOKEN in logs or commit it directly — it's only ever
#    referenced via secrets.GH_TOKEN above.
# 3. Safe to re-run: it only rewrites content between the two HTML markers
#    below, so re-running won't duplicate content or touch the rest of the file.
