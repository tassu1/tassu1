name: Metrics

# Generates the SVG cards used in the "GitHub activity" section of README.md,
# using lowlighter/metrics (https://github.com/lowlighter/metrics).
# Trimmed to just 3 cards on purpose, to keep the profile compact:
#   metrics.overview.svg, metrics.calendar.svg, metrics.languages.svg

on:
  schedule:
    - cron: "0 1 * * *"      # once a day
  workflow_dispatch:          # manual run from the Actions tab

concurrency:
  group: metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview (repos, followers, stars, activity)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.overview.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata

      - name: Contribution calendar
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.calendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata

      - name: Most used languages
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
